<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>The Champions 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#111;color:#ccc;font:14px sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#game{width:600px;height:450px}
/* AMÉLIORATION VISUELLE : Empêche le flou et rend les pixels nets */
#game canvas {
  image-rendering: -moz-crisp-edges;
  image-rendering: -webkit-crisp-edges;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#bar button{background:#333;color:#eee;border:1px solid #555;padding:6px 12px;margin:0 3px;cursor:pointer;border-radius:4px}
#bar button.on{background:#2a7;border-color:#2a7;font-weight:bold}
</style>
</head>
<body>
<div id="game"></div>
<div id="bar">Taille : <button data-s="1">Petit (rapide)</button><button data-s="1.33">Moyen</button><button data-s="1.67">Grand</button>
<small>— si c'est saccadé, choisis « Petit »</small></div>
<script src="https://cloudflare.com"></script>
<script src="ruffle/ruffle.js"></script>
<script>
window.addEventListener("load",()=>{
  const g=document.getElementById("game");
  const p=window.RufflePlayer.newest().createPlayer();
  p.style.width="100%";p.style.height="100%";
  g.appendChild(p);
  
  /* AMÉLIORATION VISUELLE : Passage de quality "low" à "high" pour lisser les formes */
  p.load({
    url:"thechampions3d.swf",
    autoplay:"on",
    unmuteOverlay:"visible",
    letterbox:"on",
    contextMenu:"off",
    quality:"high" 
  });
  
  function size(s){g.style.width=(600*s)+"px";g.style.height=(450*s)+"px";
    document.querySelectorAll("#bar button").forEach(b=>b.classList.toggle("on",b.dataset.s==s));
    try{localStorage.setItem("tc3d",s)}catch(e){}}
  document.querySelectorAll("#bar button").forEach(b=>b.onclick=()=>size(+b.dataset.s));
  let s=1;try{s=+localStorage.getItem("tc3d")||1}catch(e){}
  size(s);
});
</script>
</body>
</html>
